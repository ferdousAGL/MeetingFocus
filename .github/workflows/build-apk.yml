          package com.personal.meetingfocus
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          class FocusNotificationService : NotificationListenerService() {
              override fun onNotificationPosted(sbn: StatusBarNotification?) {
                  super.onNotificationPosted(sbn)
                  if (sbn == null || !PrefsManager.isMeetingModeActive(this)) return
                  val pkg = sbn.packageName
                  if (pkg == packageName) return
                  val frozen = PrefsManager.getFrozenPackages(this)
                  val allowed = PrefsManager.getAllowedPackages(this)
                  if (frozen.contains(pkg) || !allowed.contains(pkg)) {
                      try {
                          if (sbn.isClearable) cancelNotification(sbn.key)
                          else snoozeNotification(sbn.key, 60 * 60 * 1000L)
                      } catch (_: Exception) {}
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/personal/meetingfocus/FocusVpnService.kt
          package com.personal.meetingfocus
          import android.content.Intent
          import android.net.VpnService
          import android.os.ParcelFileDescriptor
          class FocusVpnService : VpnService() {
              private var vpnInterface: ParcelFileDescriptor? = null
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_STOP_VPN) { stopVpn(); stopSelf(); return START_NOT_STICKY }
                  startVpn()
                  return START_STICKY
              }
              private fun startVpn() {
                  stopVpn()
                  val blockedPackages = mutableSetOf<String>()
                  blockedPackages.addAll(PrefsManager.getOfflinePackages(this))
                  blockedPackages.addAll(PrefsManager.getFrozenPackages(this))
                  blockedPackages.remove(packageName)
                  if (blockedPackages.isEmpty()) { stopSelf(); return }
                  val builder = Builder().setSession("MeetingFocusPro").addAddress("10.10.10.2", 32).addRoute("0.0.0.0", 0).addRoute("::", 0)
                  var addedCount = 0
                  for (pkg in blockedPackages) {
                      try { builder.addAllowedApplication(pkg); addedCount++ } catch (_: Exception) {}
                  }
                  if (addedCount > 0) vpnInterface = builder.establish() else stopSelf()
              }
              private fun stopVpn() { try { vpnInterface?.close() } catch (_: Exception) {}; vpnInterface = null }
              override fun onDestroy() { stopVpn(); super.onDestroy() }
              companion object { const val ACTION_STOP_VPN = "com.personal.meetingfocus.STOP_VPN" }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/personal/meetingfocus/AppFreezeAccessibilityService.kt
          package com.personal.meetingfocus
          import android.accessibilityservice.AccessibilityService
          import android.app.ActivityManager
          import android.content.Context
          import android.view.accessibility.AccessibilityEvent
          import android.widget.Toast
          class AppFreezeAccessibilityService : AccessibilityService() {
              private var lastBlockedTime = 0L
              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event?.eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return
                  if (!PrefsManager.isMeetingModeActive(this)) return
                  val pkg = event.packageName?.toString() ?: return
                  if (pkg == packageName || pkg == "com.android.systemui" || pkg.contains("launcher")) return
                  if (PrefsManager.getFrozenPackages(this).contains(pkg)) {
                      try { (getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager).killBackgroundProcesses(pkg) } catch (_: Exception) {}
                      performGlobalAction(GLOBAL_ACTION_HOME)
                      val now = System.currentTimeMillis()
                      if (now - lastBlockedTime > 2000L) {
                          lastBlockedTime = now
                          Toast.makeText(this, "❄️ এই অ্যাপটি মিটিং মোডে ফ্রিজ করা আছে", Toast.LENGTH_SHORT).show()
                      }
                  }
              }
              override fun onInterrupt() {}
          }
          EOF

