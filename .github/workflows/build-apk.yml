          package com.personal.meetingfocus
          import android.content.Context
          object PrefsManager {
              private const val PREFS_NAME = "meeting_focus_v2_prefs"
              private const val KEY_MEETING_ACTIVE = "meeting_active"
              private const val KEY_ALLOWED_PACKAGES = "allowed_packages"
              private const val KEY_OFFLINE_PACKAGES = "offline_packages"
              private const val KEY_FROZEN_PACKAGES = "frozen_packages"
              private val DEFAULT_ALLOWED = setOf("com.whatsapp", "com.whatsapp.w4b", "com.google.android.apps.messaging", "com.android.mms", "com.android.dialer", "com.google.android.dialer")
              private val DEFAULT_OFFLINE = setOf("com.facebook.orca", "com.facebook.katana", "com.facebook.lite", "com.instagram.android", "com.zhiliaoapp.musically", "com.ss.android.ugc.trill", "com.imo.android.imoim", "org.telegram.messenger", "com.snapchat.android")
              val BROWSER_PACKAGES = setOf("com.android.chrome", "com.sec.android.app.sbrowser", "org.mozilla.firefox", "com.opera.browser", "com.opera.mini.native", "com.brave.browser", "com.microsoft.emmx", "com.mi.globalbrowser", "com.android.browser", "com.google.android.googlequicksearchbox")
              fun isMeetingModeActive(context: Context): Boolean = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE).getBoolean(KEY_MEETING_ACTIVE, false)
              fun setMeetingModeActive(context: Context, active: Boolean) = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE).edit().putBoolean(KEY_MEETING_ACTIVE, active).apply()
              fun getAllowedPackages(context: Context): Set<String> = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE).getStringSet(KEY_ALLOWED_PACKAGES, DEFAULT_ALLOWED) ?: DEFAULT_ALLOWED
              fun setPackageAllowed(context: Context, pkg: String, allowed: Boolean) {
                  val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                  val set = getAllowedPackages(context).toMutableSet()
                  if (allowed) set.add(pkg) else set.remove(pkg)
                  prefs.edit().putStringSet(KEY_ALLOWED_PACKAGES, set).apply()
              }
              fun getOfflinePackages(context: Context): Set<String> = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE).getStringSet(KEY_OFFLINE_PACKAGES, DEFAULT_OFFLINE) ?: DEFAULT_OFFLINE
              fun setPackageOffline(context: Context, pkg: String, offline: Boolean) {
                  val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                  val set = getOfflinePackages(context).toMutableSet()
                  if (offline) set.add(pkg) else set.remove(pkg)
                  prefs.edit().putStringSet(KEY_OFFLINE_PACKAGES, set).apply()
              }
              fun setBulkOfflinePackages(context: Context, pkgs: Set<String>) = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE).edit().putStringSet(KEY_OFFLINE_PACKAGES, pkgs).apply()
              fun getFrozenPackages(context: Context): Set<String> = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE).getStringSet(KEY_FROZEN_PACKAGES, emptySet()) ?: emptySet()
              fun setPackageFrozen(context: Context, pkg: String, frozen: Boolean) {
                  val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                  val set = getFrozenPackages(context).toMutableSet()
                  if (frozen) set.add(pkg) else set.remove(pkg)
                  prefs.edit().putStringSet(KEY_FROZEN_PACKAGES, set).apply()
              }
          }
