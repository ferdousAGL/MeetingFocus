              private fun setFilterTab(idx: Int) {
                  currentFilter = idx
                  val tabs = listOf(tabAll, tabAllowed, tabOffline, tabFrozen)
                  val bgs = listOf(R.drawable.bg_pill_frozen, R.drawable.bg_pill_allowed, R.drawable.bg_pill_offline, R.drawable.bg_pill_frozen)
                  for (i in tabs.indices) {
                      tabs[i].setBackgroundResource(if (i == idx) bgs[i] else R.drawable.bg_pill_inactive)
                      tabs[i].setTextColor(if (i == idx) Color.WHITE else Color.parseColor("#94A3B8"))
                  }
                  txtTabHelper.text = when (idx) {
                      1 -> "🟢 সচল তালিকা: এই অ্যাপগুলোর ইন্টারনেট, কল ও মেসেজ ১০০% চালু আছে"
                      2 -> "🚫 শুধু নেট অফ: এই অ্যাপগুলোর ইন্টারনেট ও নোটিফিকেশন বন্ধ (অনলাইনে দেখাবে না)"
                      3 -> "❄️ সম্পূর্ণ অফ: এই অ্যাপগুলো ব্যাকগ্রাউন্ড ও ইন্টারনেট থেকে পুরোপুরি বন্ধ আছে"
                      else -> "💡 যেকোনো অ্যাপের নিচে [🟢 সচল], [🚫 নেট অফ] বা [❄️ সম্পূর্ণ অফ] সিলেক্ট করুন"
                  }
                  filterApps()
              }

              private fun updateCounters() {
                  val cA = allApps.count { it.mode == PrefsManager.MODE_ACTIVE }
                  val cO = allApps.count { it.mode == PrefsManager.MODE_NET_OFF }
                  val cF = allApps.count { it.mode == PrefsManager.MODE_FROZEN }
                  txtCountAllowed.text = "$cA"; txtCountOffline.text = "$cO"; txtCountFrozen.text = "$cF"
                  tabAll.text = "সব (${allApps.size})"; tabAllowed.text = "🟢 সচল ($cA)"; tabOffline.text = "🚫 নেট অফ ($cO)"; tabFrozen.text = "❄️ অফ ($cF)"
              }

              private fun killApp(pkg: String) { try { (getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager).killBackgroundProcesses(pkg) } catch (_: Exception) {} }
              private fun killFrozen() { for (p in PrefsManager.getFrozen(this)) killApp(p) }

              private fun ensureStarted() {
                  if (!PrefsManager.isMeetingActive(this)) {
                      PrefsManager.setMeetingActive(this, true)
                      supSwitch = true; switchMeetingMode.isChecked = true; supSwitch = false
                      updateHero(true)
                  }
                  startVpn()
              }

              private fun startVpn() {
                  val i = VpnService.prepare(this)
                  if (i != null) startActivityForResult(i, 1001) else startService(Intent(this, FocusVpnService::class.java))
              }
              private fun stopVpn() { startService(Intent(this, FocusVpnService::class.java).apply { action = "STOP_VPN" }) }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(req: Int, res: Int, d: Intent?) {
                  super.onActivityResult(req, res, d)
                  if (req == 1001 && res == RESULT_OK) startService(Intent(this, FocusVpnService::class.java))
              }

              private fun sortApps() { allApps.sortWith(compareBy<AppEntry> { it.mode }.thenBy { it.appName.lowercase() }) }

              private fun loadApps() {
                  val pm = packageManager
                  val no = PrefsManager.getNetOff(this); val fr = PrefsManager.getFrozen(this)
                  val list = pm.getInstalledApplications(0)
                      .filter { (it.flags and ApplicationInfo.FLAG_SYSTEM) == 0 || PrefsManager.ESSENTIAL.contains(it.packageName) || no.contains(it.packageName) || fr.contains(it.packageName) }
                      .filter { it.packageName != packageName }
                      .map {
                          val m = if (fr.contains(it.packageName)) PrefsManager.MODE_FROZEN else if (no.contains(it.packageName)) PrefsManager.MODE_NET_OFF else PrefsManager.MODE_ACTIVE
                          AppEntry(pm.getApplicationLabel(it).toString(), it.packageName, pm.getApplicationIcon(it), m)
                      }
                  allApps.clear(); allApps.addAll(list); sortApps(); updateCounters()
                  recyclerApps.layoutManager = LinearLayoutManager(this)
                  adapter = AppAdapter(displayedApps); recyclerApps.adapter = adapter
                  filterApps()
              }

              private fun filterApps() {
                  val q = edtSearch.text?.toString()?.trim()?.lowercase() ?: ""
                  displayedApps.clear()
                  for (a in allApps) {
                      if (q.isNotEmpty() && !a.appName.lowercase().contains(q) && !a.packageName.lowercase().contains(q)) continue
                      val ok = when (currentFilter) {
                          1 -> a.mode == PrefsManager.MODE_ACTIVE
                          2 -> a.mode == PrefsManager.MODE_NET_OFF
                          3 -> a.mode == PrefsManager.MODE_FROZEN
                          else -> true
                      }
                      if (ok) displayedApps.add(a)
                  }
                  adapter?.notifyDataSetChanged()
              }

