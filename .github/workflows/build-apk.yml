          cat << 'EOF' > app/src/main/java/com/personal/meetingfocus/FocusVpnService.kt
          package com.personal.meetingfocus
          import android.content.Intent
          import android.net.VpnService
          import android.os.ParcelFileDescriptor
          class FocusVpnService : VpnService() {
              private var vpnInterface: ParcelFileDescriptor? = null
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_STOP_VPN) { stopVpn(); stopSelf(); return START_NOT_STICKY }
                  startVpn()
                  return START_STICKY
              }
              private fun startVpn() {
                  stopVpn()
                  val blockedPackages = mutableSetOf<String>()
                  blockedPackages.addAll(PrefsManager.getOfflinePackages(this))
                  blockedPackages.addAll(PrefsManager.getFrozenPackages(this))
                  blockedPackages.remove(packageName)
                  if (blockedPackages.isEmpty()) { stopSelf(); return }
                  val builder = Builder().setSession("MeetingFocusPro").addAddress("10.10.10.2", 32).addRoute("0.0.0.0", 0).addRoute("::", 0)
                  var addedCount = 0
                  for (pkg in blockedPackages) {
                      try { builder.addAllowedApplication(pkg); addedCount++ } catch (_: Exception) {}
                  }
                  if (addedCount > 0) vpnInterface = builder.establish() else stopSelf()
              }
              private fun stopVpn() { try { vpnInterface?.close() } catch (_: Exception) {}; vpnInterface = null }
              override fun onDestroy() { stopVpn(); super.onDestroy() }
              companion object { const val ACTION_STOP_VPN = "com.personal.meetingfocus.STOP_VPN" }
          }
