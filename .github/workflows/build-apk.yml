              private fun updateHeroStatus(active: Boolean) {
                  if (active) {
                      txtStatusBadge.text = "🟢 মিটিং মোড সচল (ব্রাউজিং ও সচল অ্যাপ অন আছে)"
                      txtStatusBadge.setTextColor(Color.parseColor("#34D399"))
                  } else {
                      txtStatusBadge.text = "⚪ স্ট্যান্ডবাই মোড (সব অ্যাপ স্বাভাবিক)"
                      txtStatusBadge.setTextColor(Color.parseColor("#94A3B8"))
                  }
              }
              private fun updatePermissionBadges() {
                  val notifListeners = Settings.Secure.getString(contentResolver, "enabled_notification_listeners") ?: ""
                  if (notifListeners.contains(packageName)) {
                      btnNotificationPerm.text = "✓ নোটিফিকেশন গার্ড অন"
                      btnNotificationPerm.setBackgroundResource(R.drawable.bg_pill_allowed)
                      btnNotificationPerm.setTextColor(Color.parseColor("#34D399"))
                  } else {
                      btnNotificationPerm.text = "⚠️ নোটিফিকেশন পারমিশন দিন"
                      btnNotificationPerm.setBackgroundResource(R.drawable.bg_pill_offline)
                      btnNotificationPerm.setTextColor(Color.parseColor("#FDA4AF"))
                  }
                  val accessServices = Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: ""
                  if (accessServices.contains(packageName)) {
                      btnAccessibilityPerm.text = "✓ ফ্রিজ গার্ড অন"
                      btnAccessibilityPerm.setBackgroundResource(R.drawable.bg_pill_allowed)
                      btnAccessibilityPerm.setTextColor(Color.parseColor("#34D399"))
                  } else {
                      btnAccessibilityPerm.text = "🛡️ ফ্রিজ গার্ড পারমিশন"
                      btnAccessibilityPerm.setBackgroundResource(R.drawable.bg_pill_inactive)
                      btnAccessibilityPerm.setTextColor(Color.parseColor("#E2E8F0"))
                  }
              }
              private fun applySmartMeetingPreset() {
                  val newOffline = mutableSetOf<String>()
                  for (app in allApps) {
                      if (!app.isAllowed && !PrefsManager.BROWSER_PACKAGES.contains(app.packageName)) {
                          app.isOffline = true
                          newOffline.add(app.packageName)
                      } else app.isOffline = false
                  }
                  PrefsManager.setBulkOfflinePackages(this, newOffline)
                  updateCounters()
                  adapter?.notifyDataSetChanged()
                  if (PrefsManager.isMeetingModeActive(this)) startFirewallVpn()
                  Toast.makeText(this, "⚡ সচল অ্যাপ ও ব্রাউজার বাদে বাকি সব অ্যাপ অফলাইন সেট হয়েছে!", Toast.LENGTH_SHORT).show()
              }
              private fun setFilterTab(index: Int) {
                  currentFilter = index
                  val tabs = listOf(tabAll, tabAllowed, tabOffline, tabFrozen)
                  for (i in tabs.indices) {
                      if (i == index) {
                          tabs[i].setBackgroundResource(R.drawable.bg_pill_frozen)
                          tabs[i].setTextColor(Color.WHITE)
                      } else {
                          tabs[i].setBackgroundResource(R.drawable.bg_pill_inactive)
                          tabs[i].setTextColor(Color.parseColor("#94A3B8"))
                      }
                  }
                  filterApps()
              }
              private fun updateCounters() {
                  txtCountAllowed.text = allApps.count { it.isAllowed }.toString()
                  txtCountOffline.text = allApps.count { it.isOffline || it.isFrozen }.toString()
                  txtCountFrozen.text = allApps.count { it.isFrozen }.toString()
              }
              private fun killAppInBackground(pkg: String) {
                  try { (getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager).killBackgroundProcesses(pkg) } catch (_: Exception) {}
              }
              private fun killAllFrozenApps() { for (pkg in PrefsManager.getFrozenPackages(this)) killAppInBackground(pkg) }
              private fun startFirewallVpn() {
                  val vpnIntent = VpnService.prepare(this)
                  if (vpnIntent != null) startActivityForResult(vpnIntent, 1001)
                  else startService(Intent(this, FocusVpnService::class.java))
              }
              private fun stopFirewallVpn() { startService(Intent(this, FocusVpnService::class.java).apply { action = FocusVpnService.ACTION_STOP_VPN }) }
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 1001 && resultCode == RESULT_OK) startService(Intent(this, FocusVpnService::class.java))
              }
              private fun loadInstalledApps() {
                  val pm = packageManager
                  val allowedSet = PrefsManager.getAllowedPackages(this)
                  val offlineSet = PrefsManager.getOfflinePackages(this)
                  val frozenSet = PrefsManager.getFrozenPackages(this)
                  val installed = pm.getInstalledApplications(0)
                      .filter { (it.flags and ApplicationInfo.FLAG_SYSTEM) == 0 || allowedSet.contains(it.packageName) || offlineSet.contains(it.packageName) || PrefsManager.BROWSER_PACKAGES.contains(it.packageName) }
                      .filter { it.packageName != packageName }
                      .map { AppEntry(pm.getApplicationLabel(it).toString(), it.packageName, pm.getApplicationIcon(it), allowedSet.contains(it.packageName), offlineSet.contains(it.packageName), frozenSet.contains(it.packageName)) }
                      .sortedWith(compareByDescending<AppEntry> { it.isAllowed }.thenByDescending { it.isFrozen }.thenByDescending { it.isOffline }.thenBy { it.appName })
                  allApps.clear(); allApps.addAll(installed); updateCounters()
                  recyclerApps.layoutManager = LinearLayoutManager(this)
                  adapter = AppAdapter(displayedApps)
                  recyclerApps.adapter = adapter
                  filterApps()
              }
              private fun filterApps() {
                  val query = edtSearch.text?.toString()?.trim()?.lowercase() ?: ""
                  displayedApps.clear()
                  for (app in allApps) {
                      if (query.isNotEmpty() && !app.appName.lowercase().contains(query) && !app.packageName.lowercase().contains(query)) continue
                      val matchesTab = when (currentFilter) { 1 -> app.isAllowed; 2 -> app.isOffline || app.isFrozen; 3 -> app.isFrozen; else -> true }
                      if (matchesTab) displayedApps.add(app)
                  }
                  adapter?.notifyDataSetChanged()
              }
              inner class AppAdapter(private val items: List<AppEntry>) : RecyclerView.Adapter<AppAdapter.ViewHolder>() {
                  inner class ViewHolder(view: View) : RecyclerView.ViewHolder(view) {
                      val imgAppIcon: ImageView = view.findViewById(R.id.imgAppIcon)
                      val txtAppName: TextView = view.findViewById(R.id.txtAppName)
                      val txtAppStatus: TextView = view.findViewById(R.id.txtAppStatus)
                      val btnToggleAllowed: TextView = view.findViewById(R.id.btnToggleAllowed)
                      val btnToggleOffline: TextView = view.findViewById(R.id.btnToggleOffline)
                      val btnToggleFreeze: TextView = view.findViewById(R.id.btnToggleFreeze)
                  }
                  override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): ViewHolder =
                      ViewHolder(LayoutInflater.from(parent.context).inflate(R.layout.item_app_rule, parent, false))
                  override fun onBindViewHolder(holder: ViewHolder, position: Int) {
                      val item = items[position]
                      holder.imgAppIcon.setImageDrawable(item.icon)
                      holder.txtAppName.text = item.appName
                      when {
                          item.isFrozen -> { holder.txtAppStatus.text = "❄️ সম্পূর্ণ ফ্রিজড (নেট অফ + নোটিফিকেশন বন্ধ + ব্যাকগ্রাউন্ড লক)"; holder.txtAppStatus.setTextColor(Color.parseColor("#38BDF8")) }
                          item.isOffline && item.isAllowed -> { holder.txtAppStatus.text = "🚫 অফলাইন (ইন্টারনেট বন্ধ, লোকাল অ্যালার্ট সচল)"; holder.txtAppStatus.setTextColor(Color.parseColor("#FB7185")) }
                          item.isOffline -> { holder.txtAppStatus.text = "🚫 অফলাইন ও 🔕 সাইলেন্ট (অনলাইনে দেখাবে না)"; holder.txtAppStatus.setTextColor(Color.parseColor("#FB7185")) }
                          item.isAllowed -> { holder.txtAppStatus.text = "🟢 সচল ও অনলাইন (কল ও মেসেজ আসবে)"; holder.txtAppStatus.setTextColor(Color.parseColor("#34D399")) }
                          else -> { holder.txtAppStatus.text = "🔕 নোটিফিকেশন সাইলেন্ট • 🌐 ইন্টারনেট সচল"; holder.txtAppStatus.setTextColor(Color.parseColor("#94A3B8")) }
                      }
                      if (item.isAllowed && !item.isFrozen) {
                          holder.btnToggleAllowed.text = "🔔 সচল আছে"; holder.btnToggleAllowed.setBackgroundResource(R.drawable.bg_pill_allowed); holder.btnToggleAllowed.setTextColor(Color.parseColor("#34D399"))
                      } else {
                          holder.btnToggleAllowed.text = "🔕 সাইলেন্ট"; holder.btnToggleAllowed.setBackgroundResource(R.drawable.bg_pill_inactive); holder.btnToggleAllowed.setTextColor(Color.parseColor("#94A3B8"))
                      }
                      if (item.isOffline || item.isFrozen) {
                          holder.btnToggleOffline.text = "🚫 নেট অফ"; holder.btnToggleOffline.setBackgroundResource(R.drawable.bg_pill_offline); holder.btnToggleOffline.setTextColor(Color.parseColor("#FB7185"))
                      } else {
                          holder.btnToggleOffline.text = "🌐 নেট অন"; holder.btnToggleOffline.setBackgroundResource(R.drawable.bg_pill_inactive); holder.btnToggleOffline.setTextColor(Color.parseColor("#94A3B8"))
                      }
                      if (item.isFrozen) {
                          holder.btnToggleFreeze.text = "❄️ ফ্রিজড ✓"; holder.btnToggleFreeze.setBackgroundResource(R.drawable.bg_pill_frozen); holder.btnToggleFreeze.setTextColor(Color.parseColor("#38BDF8"))
                      } else {
                          holder.btnToggleFreeze.text = "❄️ ফ্রিজ করুন"; holder.btnToggleFreeze.setBackgroundResource(R.drawable.bg_pill_inactive); holder.btnToggleFreeze.setTextColor(Color.parseColor("#94A3B8"))
                      }
                      holder.btnToggleAllowed.setOnClickListener {
                          item.isAllowed = !item.isAllowed
                          if (item.isAllowed && item.isFrozen) { item.isFrozen = false; PrefsManager.setPackageFrozen(this@MainActivity, item.packageName, false) }
                          PrefsManager.setPackageAllowed(this@MainActivity, item.packageName, item.isAllowed)
                          updateCounters(); notifyItemChanged(position)
                      }
                      holder.btnToggleOffline.setOnClickListener {
                          item.isOffline = !item.isOffline
                          if (!item.isOffline && item.isFrozen) { item.isFrozen = false; PrefsManager.setPackageFrozen(this@MainActivity, item.packageName, false) }
                          PrefsManager.setPackageOffline(this@MainActivity, item.packageName, item.isOffline)
                          updateCounters(); notifyItemChanged(position)
                          if (PrefsManager.isMeetingModeActive(this@MainActivity)) startFirewallVpn()
                      }
                      holder.btnToggleFreeze.setOnClickListener {
                          item.isFrozen = !item.isFrozen
                          PrefsManager.setPackageFrozen(this@MainActivity, item.packageName, item.isFrozen)
                          if (item.isFrozen) {
                              item.isOffline = true; item.isAllowed = false
                              PrefsManager.setPackageOffline(this@MainActivity, item.packageName, true)
                              PrefsManager.setPackageAllowed(this@MainActivity, item.packageName, false)
                              killAppInBackground(item.packageName)
                              Toast.makeText(this@MainActivity, "❄️ ${item.appName} অ্যাপের ভেতরেই ফ্রিজ করা হয়েছে!", Toast.LENGTH_SHORT).show()
                          } else {
                              Toast.makeText(this@MainActivity, "${item.appName} আনফ্রিজ করা হয়েছে", Toast.LENGTH_SHORT).show()
                          }
                          updateCounters(); notifyItemChanged(position)
                          if (PrefsManager.isMeetingModeActive(this@MainActivity)) startFirewallVpn()
                      }
                  }
                  override fun getItemCount(): Int = items.size
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: MeetingFocus-Por-3-APK
          path: app/build/outputs/apk/debug/app-debug.apk
