name: Build MeetingFocus APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Project v3.0
        run: |
          mkdir -p app/src/main/res/mipmap-anydpi-v26 app/src/main/java/com/personal/meetingfocus
          bash setup_v3.sh
          cat m1.txt m2.txt > app/src/main/java/com/personal/meetingfocus/MainActivity.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: MeetingFocus-Pro-v3-APK
          path: app/build/outputs/apk/debug/app-debug.apk
